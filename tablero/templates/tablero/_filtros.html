<form class="filtros" method="get" action="{% if vista == 'detalle' %}/detalle/{% else %}/{% endif %}">
  <label>Zona agrícola
    <select name="zona">
      {% for zid, z in zonas.items %}<option value="{{ zid }}" {% if zid == zona %}selected{% endif %}>{{ z.nombre }} ({{ z.region }})</option>{% endfor %}
    </select>
  </label>
  <label>Año
    <select name="anio">
      {% for a in anios %}<option value="{{ a }}" {% if a == anio %}selected{% endif %}>{{ a }}</option>{% endfor %}
    </select>
  </label>
  <button type="submit">Aplicar</button>
</form>
